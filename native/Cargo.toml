[workspace]
resolver = "2"
members = [
    "asd-nexus-client",
    "asd-nexus-cli",
    "asd-nexus-desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["ASD Nexus Team"]

[workspace.dependencies]
asd-nexus-client = { path = "asd-nexus-client" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
ureq = { version = "2.10", features = ["json"] }
url = "2.5"
ratatui = "0.29"
crossterm = "0.28"
clap = { version = "4.5", features = ["derive"] }
eframe = "0.30"
egui = "0.30"
rfd = "0.15"
anyhow = "1.0"
